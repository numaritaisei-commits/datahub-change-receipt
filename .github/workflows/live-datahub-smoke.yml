name: live DataHub Core smoke

on:
  workflow_dispatch:
    inputs:
      approve_synthetic_write_back:
        description: Approve one synthetic decision write, read-back, and deletion
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-datahub-core-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    if: >-
      github.event.repository.visibility == 'public' &&
      github.repository == 'numaritaisei-commits/datahub-change-receipt' &&
      inputs.approve_synthetic_write_back == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATAHUB_GMS_URL: http://localhost:8080
      DATAHUB_TELEMETRY_ENABLED: "false"
      SAVE_DOCUMENT_TOOL_ENABLED: "true"
      TOOLS_IS_MUTATION_ENABLED: "true"
      UV_LOCKED: "1"
      UV_NO_CACHE: "1"
      UV_NO_DEV: "1"
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.11.26"
      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev --no-cache
      - name: Fail-closed runner resource preflight
        shell: bash
        run: |
          set -euo pipefail
          cpu_count="$(nproc)"
          memory_kib="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          disk_kib="$(df -Pk . | awk 'NR == 2 {print $4}')"
          echo "runner_cpu_count=$cpu_count"
          echo "runner_memory_kib=$memory_kib"
          echo "runner_disk_available_kib=$disk_kib"
          test "$cpu_count" -ge 2
          test "$memory_kib" -ge 8388608
          test "$disk_kib" -ge 13631488
          echo "datahub_resource_preflight=passed"
      - name: Start pinned official DataHub Core quickstart
        run: >-
          uv run --no-sync --no-cache datahub docker quickstart
          --version v1.6.0
          --accept-version-default
      - name: Record quickstart resource-probe image digest
        shell: bash
        run: |
          set -euo pipefail
          probe_digest="$(docker image inspect alpine:latest --format '{{index .RepoDigests 0}}')"
          test -n "$probe_digest"
          echo "datahub_quickstart_probe_image=$probe_digest"
      - name: Seed synthetic metadata only
        run: uv run --no-sync --no-cache python scripts/seed_synthetic_datahub.py
      - name: Retrieve and verify live Agent Context Kit evidence
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in 1 2 3 4; do
            uv run --no-sync --no-cache datahub-change-receipt \
              --mode datahub \
              --request examples/live-change-request.json \
              --json-out /tmp/live-receipt.json \
              --markdown-out /tmp/live-receipt.md
            if uv run --no-sync --no-cache python scripts/verify_live_receipt.py /tmp/live-receipt.json; then
              verified=1
              break
            fi
            if test "$attempt" -lt 4; then
              sleep "$((attempt * 10))"
            fi
          done
          test "$verified" -eq 1
      - name: Write, read back, and remove approved synthetic decision
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync --no-cache datahub-change-receipt \
            --mode datahub \
            --request examples/live-change-request.json \
            --json-out /tmp/live-receipt.json \
            --markdown-out /tmp/live-receipt.md \
            --approve-write-back \
            --write-back-urn-out /tmp/synthetic-document.urn
          uv run --no-sync --no-cache python scripts/verify_live_writeback.py prove \
            --approve-write-back \
            --urn-file /tmp/synthetic-document.urn \
            --receipt /tmp/live-receipt.json \
            --markdown /tmp/live-receipt.md \
            --proof-out /tmp/live-writeback-proof.json
      - name: Preserve synthetic proof artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-live-datahub-receipt
          path: |
            /tmp/live-receipt.json
            /tmp/live-receipt.md
            /tmp/live-writeback-proof.json
          if-no-files-found: error
          retention-days: 35
      - name: Always remove the synthetic decision document
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -e /tmp/synthetic-document.urn || test -L /tmp/synthetic-document.urn; then
            uv run --no-sync --no-cache python scripts/verify_live_writeback.py cleanup \
              --urn-file /tmp/synthetic-document.urn
          else
            echo "synthetic_write_back_cleanup_verified=true"
          fi
      - name: Always stop the ephemeral DataHub stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stop_status=0
          if test -x .venv/bin/datahub; then
            .venv/bin/datahub docker quickstart --stop || stop_status=$?
          fi
          running_containers="$(docker ps --quiet)"
          if test -n "$running_containers"; then
            echo "ephemeral_containers_remaining=true" >&2
            exit 1
          fi
          if test "$stop_status" -ne 0; then
            echo "datahub_quickstart_stop_failed=true" >&2
            exit "$stop_status"
          fi
          echo "ephemeral_containers_remaining=false"
